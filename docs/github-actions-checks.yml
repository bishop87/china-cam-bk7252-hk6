name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r tools/requirements.txt
      - name: Application tests
        run: PYTHONPATH=app python -m unittest discover -s app/tests -v
      - name: Tool tests (private fixtures explicitly skipped)
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Firmware transport tests with sanitizers
        run: |
          cc -std=c99 -Wall -Wextra -Werror -fsanitize=address,undefined tests/test_stock_http.c firmware/stock-http/http.c -o /tmp/hk6-stock-http-test
          /tmp/hk6-stock-http-test
          cc -std=c99 -Wall -Wextra -Werror -Itests tests/test_http.c -o /tmp/hk6-localcam-test
          /tmp/hk6-localcam-test
      - name: Public repository checks
        run: python tools/check_publication.py
